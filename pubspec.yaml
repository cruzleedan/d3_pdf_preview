name: d3_pdf_preview
description: >-
  An in-app PDF preview for d3 apps: flat pages, pinch and double-tap zoom
  that stays sharp, loading and error states, and room for each app's own
  actions (save, share, print).
version: 0.1.0
publish_to: none
homepage: https://github.com/cruzleedan/d3_pdf_preview
repository: https://github.com/cruzleedan/d3_pdf_preview
issue_tracker: https://github.com/cruzleedan/d3_pdf_preview/issues

topics:
  - pdf
  - preview
  - zoom

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  d3_ui:
    git:
      url: https://github.com/cruzleedan/d3_ui.git
      ref: master
  material_ui: ^1.1.0
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
